spring.application.name=sherlock
server.port=8080

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

sherlock.base-directory=${user.home}/Documents/Sherlock
sherlock.python-command=python3
# Path to the Python pipeline entrypoint (repo root main.py).
# Leave empty for auto-discovery: walks up from the working directory / jar
# location until main.py is found.
sherlock.python-script-path=
# Flag used to pass the case directory to main.py (see main.py --help).
sherlock.process-argument=--project

logging.level.com.sherlock=INFO
